{% extends "base.html" %}
{% block content %}

<h1>Run Analysis</h1>
<p>Please upload your dataset and set the parameters below.</p>

<div class="upload-section">
  <form id="analysis-form" action="/submit" method="post" enctype="multipart/form-data">
    <div class="upload-container">

      <!-- ===================== 左邊：上傳檔案 ===================== -->
      <div class="upload-left">
        <label class="upload-label">Click here to upload your file</label>
        <input type="file" id="fileInput" name="file" accept=".csv">

        <p style="margin-top: 6px; color:#666; font-size:14px;">
          Maximum upload size: <strong>300 MB</strong>
        </p>

        <!-- ⭐ Load Example -->
        <button id="loadExampleBtn" type="button"
                style="margin-top: 12px; width: 100%; padding: 12px;
                       font-size: 16px; font-weight: 600;
                       background-color: #5b77d1; color: white;
                       border: none; border-radius: 6px; cursor: pointer;">
          Load Example
        </button>

        <!-- ⭐ Preview + Download -->
        <div style="margin-top:12px; display:flex; gap:10px;">
          <button id="previewBtn" type="button"
                  style="flex:1; padding:10px; background:#2e8b8b; color:white;
                  border:none; border-radius:6px; cursor:pointer;" disabled>
            Preview
          </button>

          <button id="downloadBtn" type="button"
                  style="flex:1; padding:10px; background:#2b7d2b; color:white;
                  border:none; border-radius:6px; cursor:pointer;" disabled>
            Download
          </button>
        </div>

      </div>

      <!-- ===================== 右邊：參數設定 ===================== -->
      <div class="upload-right">
        <p style="font-style: italic; color: #444; margin-top: 0;">
          Tau₁ and Tau₂ should be values between 0 and 1.
        </p>

        <label for="tau1">Set Tau₁:</label>
        <input type="number" id="tau1" name="tau1" step="0.01" min="0" max="1"
               value="{{ tau1 or 0.5 }}" required><br>

        <label for="tau2">Set Tau₂:</label>
        <input type="number" id="tau2" name="tau2" step="0.01" min="0" max="1"
               value="{{ tau2 or 0.7 }}" required><br>

        <label for="index">Set Index (optional):</label>
        <input type="text" id="index" name="index" placeholder="Enter column index"><br>

        <label for="label">Label column (optional):</label>
        <input type="text" id="label" name="label" placeholder="e.g., cell_type">
      </div>
    </div>

    <!-- Gmail 區塊 -->
    <div class="email-section">
      <label for="gmail">Your Gmail address (optional):</label>
      <input type="email" id="gmail" name="gmail"
             placeholder="you@gmail.com" value="{{ gmail or '' }}">
    </div>

    <input type="hidden" id="example_flag" name="example_flag" value="false">

    <div class="submit-section">
      <button type="submit" class="submit-btn">Submit</button>
      <button type="reset" class="submit-btn"
              style="background-color: #ccc; color: #333; margin-left: 10px;">
        Reset
      </button>
    </div>
  </form>
</div>

<!-- ===================== 成功訊息 ===================== -->
{% if message %}
  <div class="jobid-section">
    <p class="jobid-text">{{ message|safe }}</p>
  </div>
{% endif %}

<!-- ===================== Preview Modal（漂亮版） ===================== -->
<div id="previewModal"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.45); z-index:9999;
            justify-content:center; align-items:center;">

  <div id="modalBox"
       style="background:white; padding:20px; width:85%; max-height:80%;
              overflow:auto; border-radius:10px; position:relative;">

    <!-- Close 按鈕（右上角） -->
    <button id="closePreviewBtn"
            style="position:absolute; top:10px; right:10px;
                   padding:8px 14px; background:#5b77d1; color:white;
                   border:none; border-radius:6px; cursor:pointer;">
      Close
    </button>

    <h2 style="margin-top:40px;">Preview (first 100 rows)</h2>
    <div id="previewContent" style="overflow:auto;"></div>

  </div>
</div>

<!-- ===================== JS ===================== -->
<script>
/* ----------------------------- CSV → HTML table -----------------------------*/
function csvToTable(csvText) {
    const lines = csvText.split("\n").slice(0, 100);
    let html = "<table style='border-collapse:collapse; width:100%; font-size:13px;'>";

    for (let line of lines) {
        if (!line.trim()) continue;
        html += "<tr>";
        const cols = line.split(",");
        for (let c of cols) {
            html += `<td style="border:1px solid #ccc; padding:4px;">${c}</td>`;
        }
        html += "</tr>";
    }
    html += "</table>";
    return html;
}

/* ----------------------------- Preview File ----------------------------- */
async function previewFile(file) {
    const text = await file.text();
    document.getElementById("previewContent").innerHTML = csvToTable(text);
    document.getElementById("previewModal").style.display = "flex";
}

/* ----------------------------- Close modal ----------------------------- */
document.getElementById("closePreviewBtn").onclick = () => {
    document.getElementById("previewModal").style.display = "none";
};

/* ⭐ 點擊空白區域也可關閉 */
document.getElementById("previewModal").onclick = (e) => {
    if (e.target.id === "previewModal") {
        document.getElementById("previewModal").style.display = "none";
    }
};

/* ----------------------------- 上傳啟用按鈕 ----------------------------- */
fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    const MAX_SIZE = 300 * 1024 * 1024;  // 300 MB

    if (!file) return;

    // 檔案太大 → 直接阻止 + 清空欄位 + 跳警告
    if (file.size > MAX_SIZE) {
        alert("❌ File too large! Maximum allowed size is 300 MB.");
        fileInput.value = "";  // 清空上傳欄位（重設）
        return;
    }

    // 正常情況（檔案 OK） → 保持你原本的行為
    previewBtn.disabled = false;
    downloadBtn.disabled = false;
});


/* ----------------------------- Preview ----------------------------- */
previewBtn.onclick = () => {
    const file = fileInput.files[0];
    if (file) previewFile(file);
};

/* ----------------------------- Download ----------------------------- */
downloadBtn.onclick = () => {
    const file = fileInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    a.click();
    URL.revokeObjectURL(url);
};

/* ----------------------------- Load Example ----------------------------- */
document.getElementById("loadExampleBtn").onclick = async function () {
    const resp = await fetch("/fetch-example");
    const blob = await resp.blob();

    const exampleFile = new File([blob], "example.csv", { type: "text/csv" });

    const dt = new DataTransfer();
    dt.items.add(exampleFile);
    fileInput.files = dt.files;

    previewBtn.disabled = false;
    downloadBtn.disabled = false;

    document.getElementById("example_flag").value = "true";
};
</script>

{% endblock %}
